[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stream-clipper"
version = "0.7.4"
description = "AI Stream Clipper - live stream monitoring, moment detection and automatic vertical clip rendering"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "psutil>=5.9",
    "cryptography>=43",  # Phase 4: tokens of connected publishing accounts encrypted at rest
]

[project.optional-dependencies]
# Stream monitor / capture worker
capture = ["streamlink>=6.8"]
# Audio worker (CPU transcription; Silero VAD is bundled with faster-whisper)
audio = ["faster-whisper>=1.0", "onnxruntime>=1.18"]  # onnxruntime: YAMNet acoustic classes
# Vision worker (heuristic provider)
vision = ["opencv-python-headless>=4.9,<5"]
# Vision worker with Intel Arc / OpenVINO VLM provider (experimental)
# pinned to the version validated on the servers (OpenVINO 2026.2.0); transformers only for tokenizer conversion
openvino = ["opencv-python-headless>=4.9,<5", "openvino==2026.2.0", "openvino-genai==2026.2.0.0",
            "openvino-tokenizers==2026.2.0.0", "transformers>=4.57,<5", "pillow>=10"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
clipper = "clipper.cli:main"

[tool.setuptools.packages.find]
include = ["clipper*"]

[tool.setuptools.package-data]
clipper = ["py.typed", "migrations/*.py", "migrations/versions/*.py", "migrations/*.mako", "alembic.ini"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end pipeline tests (real ffmpeg + whisper, slower)",
    "models: real model inference (OpenVINO VLM/LLM, YAMNet); skipped when models are not installed",
]

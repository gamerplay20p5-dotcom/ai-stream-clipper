# Server 210 (2htswebserver) - API (HTTPS), dashboard, scheduler, own PostgreSQL, scoring, GPU vision.
#
# Operated through `sudo asc-ctl compose ...` (see infrastructure/admin/README.md): asc-ctl
# resolves this file with /etc/asc/asc.env, checks it against the isolation policy and only
# then runs it under the compose project "asc".
#
# Does NOT touch the existing Caddy / Authentik / PostgreSQL / Redis on this host: own
# project, network, volumes and PostgreSQL (no published port). Only 192.168.1.210:8780 (HTTPS).
# Host paths are fixed (no env interpolation): /opt/asc/* and /etc/asc/tls (read-only).

name: asc

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  tmpfs: ["/tmp:size=512m"]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

x-app-env: &app-env
  ASC_ENV: production
  ASC_LOG_JSON: "true"
  ASC_DATABASE_URL: postgresql+psycopg://asc:${ASC_DB_PASSWORD:?set ASC_DB_PASSWORD}@${ASC_DB_HOST:-postgres}:${ASC_DB_PORT:-5432}/asc
  ASC_INTERNAL_SECRET: ${ASC_INTERNAL_SECRET:?set ASC_INTERNAL_SECRET}
  ASC_API_URL: https://api:8780
  ASC_API_CA_FILE: /tls/ca.crt
  ASC_WORKER_HOST_LABEL: "210"

services:
  postgres:
    image: postgres:16.4-bookworm
    container_name: asc-postgres
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: asc
      POSTGRES_USER: asc
      POSTGRES_PASSWORD: ${ASC_DB_PASSWORD:?set ASC_DB_PASSWORD}
    volumes: ["asc_pgdata:/var/lib/postgresql/data"]
    networks: [asc_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asc -d asc"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "2", memory: 4g }
    shm_size: 256m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  api:
    # The API runs its own tag (0.8.1: sign-up lock) while the other 210 services stay on ASC_IMAGE_TAG.
    # At the next full release, put the API back on ASC_IMAGE_TAG.
    image: ai-stream-clipper:${ASC_API_TAG:-0.8.1}
    container_name: asc-api
    <<: *hardening
    command: ["api", "--host", "0.0.0.0", "--port", "8780"]
    environment:
      <<: *app-env
      ASC_JWT_SECRET: ${ASC_JWT_SECRET:?set ASC_JWT_SECRET}
      ASC_ADMIN_EMAIL: ${ASC_ADMIN_EMAIL:-}
      ASC_ADMIN_PASSWORD: ${ASC_ADMIN_PASSWORD:-}
      ASC_COOKIE_SECURE: "true"
      # Canonical https address of the dashboard for e-mailed links (never taken from request headers)
      ASC_PUBLIC_ORIGIN: ${ASC_PUBLIC_ORIGIN:?set ASC_PUBLIC_ORIGIN to the https address of the dashboard}
      ASC_ALLOW_FILE_SOURCES: ${ASC_ALLOW_FILE_SOURCES:-false}
      ASC_TEST_MEDIA_DIR: /nonexistent  # test videos live on 206; the API validates names only
      ASC_TLS_CERT: /tls/server.crt
      ASC_TLS_KEY: /tls/server.key
      ASC_STORAGE_MAX_GB: ${ASC_STORAGE_MAX_GB:-300}
      ASC_METRICS_TOKEN: ${ASC_METRICS_TOKEN:-}
      ASC_OIDC_ISSUER: ${ASC_OIDC_ISSUER:-}
      ASC_OIDC_CLIENT_ID: ${ASC_OIDC_CLIENT_ID:-}
      # Billing link to the commercial service (off while ASC_BILLING_SECRET is empty: checkout stays disabled).
      # Takes effect the next time the api container is recreated.
      ASC_BILLING_SECRET: ${ASC_BILLING_SECRET:-}
      # Public self sign-up stays closed until the terms and privacy policy are published
      ASC_SIGNUP_OPEN: ${ASC_SIGNUP_OPEN:-false}
      # While closed: e-mails allowed to sign up (controlled accounts), comma separated
      ASC_SIGNUP_ALLOWED_EMAILS: ${ASC_SIGNUP_ALLOWED_EMAILS:-}
      ASC_COMMERCIAL_URL: http://commercial:8790
    ports: ["192.168.1.210:8780:8780"]
    volumes: ["asc_clips:/data/storage", "/etc/asc/tls:/tls:ro"]
    networks: [asc_net]
    # No depends_on on the local postgres: the database lives on 212 (ASC_DB_HOST=192.168.1.212), so
    # `compose up api` must never start the old local copy. Only if ASC_DB_HOST=postgres (back to the local
    # database) start it explicitly first: `asc-ctl compose up postgres`. Until the database answers, the API
    # exits at start-up and `restart: unless-stopped` retries it.
    healthcheck:
      test: ["CMD", "clipper", "healthcheck", "api"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }

  worker-scoring:
    image: ai-stream-clipper:${ASC_IMAGE_TAG:-0.7.0}
    container_name: asc-worker-scoring
    <<: *hardening
    command: ["worker", "--roles", "scoring"]
    environment:
      <<: *app-env
      ASC_WORKER_ID: "210-scoring"
    volumes: ["asc_workdir:/data/work", "/etc/asc/tls/ca.crt:/tls/ca.crt:ro"]
    networks: [asc_net]
    depends_on: { api: { condition: service_healthy } }
    healthcheck: &worker-health
      test: ["CMD", "clipper", "healthcheck", "worker"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }

  # Phase 4 auto publisher: own service, DB access (tokens never cross the worker API), rendered
  # videos read-only, outbound HTTPS to the official YouTube / TikTok / Instagram APIs.
  worker-publisher:
    image: ai-stream-clipper:${ASC_IMAGE_TAG:-0.7.0}
    container_name: asc-worker-publisher
    <<: *hardening
    command: ["publisher"]
    environment:
      <<: *app-env
      ASC_JWT_SECRET: ${ASC_JWT_SECRET:?set ASC_JWT_SECRET}
      ASC_WORKER_ID: "210-publisher"
    volumes: ["asc_clips:/data/storage:ro"]
    networks: [asc_net]
    depends_on: { api: { condition: service_healthy } }
    healthcheck: *worker-health
    deploy:
      resources:
        limits: { cpus: "1", memory: 1g }

  # Cloudflare Tunnel connector (profile "tunnel": started only with `asc-ctl compose up --tunnel`).
  # Outbound-only (no published port). The public hostname clipper.friendhost.com.br forwards ONLY
  # /api/publish/oauth/<platform>/callback to https://api:8780 (ingress rules live in the Cloudflare
  # dashboard; everything else answers 404). The token is a root-installed file
  # (`asc-ctl tunnel-token-install`, read from stdin) mounted read-only - never an env var or argument.
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:${ASC_CLOUDFLARED_TAG:-2025.4.0}
    container_name: asc-tunnel
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/etc/asc/tunnel/token"]
    volumes:
      - { type: bind, source: /etc/asc/tunnel/token, target: /etc/asc/tunnel/token, read_only: true }
      - { type: bind, source: /etc/asc/tls/ca.crt, target: /etc/asc/tls/ca.crt, read_only: true }
    networks: [asc_net]
    depends_on: { api: { condition: service_healthy } }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  # Commercial site (landing + billing service), Node.js 24. Published by the server's proxy as
  # https://getclipper.howto.software -> 192.168.1.210:8790. Payments stay OFF until the provider keys, the billing
  # link and https origins are set; the waitlist stays CLOSED until COMMERCIAL_WAITLIST_OPEN=true (privacy/terms).
  # SQLite (waitlist, subscriptions, ledger, outbox, promotions) lives in the named volume asc_commercial.
  commercial:
    image: ai-stream-clipper-commercial:${ASC_COMMERCIAL_TAG:-1.0.3}
    container_name: asc-commercial
    <<: *hardening
    environment:
      COMMERCIAL_DB: /data/commercial.sqlite
      COMMERCIAL_HOST: 0.0.0.0
      COMMERCIAL_PORT: "8790"
      # the proxy reaches the container through the Docker bridge: trust private addresses for the client IP
      COMMERCIAL_TRUST_PROXY: loopback, linklocal, uniquelocal
      COMMERCIAL_ORIGIN: ${COMMERCIAL_ORIGIN:-https://getclipper.howto.software}
      COMMERCIAL_WAITLIST_OPEN: ${COMMERCIAL_WAITLIST_OPEN:-false}
      # No checkout for the public until COMMERCIAL_PAYMENTS_OPEN=true (webhooks and the signed link work anyway)
      COMMERCIAL_PAYMENTS_OPEN: ${COMMERCIAL_PAYMENTS_OPEN:-false}
      # Controlled real purchase while closed: only these account ids may check out (empty = nobody)
      COMMERCIAL_PAYMENTS_TEST_ACCOUNTS: ${COMMERCIAL_PAYMENTS_TEST_ACCOUNTS:-}
      # Terms and privacy: also need every company field filled at build time (commercial/legal/empresa.json)
      COMMERCIAL_LEGAL_PUBLISHED: ${COMMERCIAL_LEGAL_PUBLISHED:-false}
      ASC_APP_URL: ${ASC_PUBLIC_ORIGIN:-}
      ASC_MAIN_API_URL: https://api:8780
      ASC_BILLING_SECRET: ${ASC_BILLING_SECRET:-}
      NODE_EXTRA_CA_CERTS: /tls/ca.crt
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_AUTOMATIC_TAX: ${STRIPE_AUTOMATIC_TAX:-false}
      INFINITEPAY_HANDLE: ${INFINITEPAY_HANDLE:-}
      INFINITEPAY_API_KEY: ${INFINITEPAY_API_KEY:-}
      INFINITEPAY_WEBHOOK_TOKEN: ${INFINITEPAY_WEBHOOK_TOKEN:-}
      INFINITEPAY_WEBHOOK_TOKEN_PREVIOUS: ${INFINITEPAY_WEBHOOK_TOKEN_PREVIOUS:-}
      INFINITEPAY_RENEW_DAYS_BEFORE: ${INFINITEPAY_RENEW_DAYS_BEFORE:-5}
      INFINITEPAY_GRACE_DAYS: ${INFINITEPAY_GRACE_DAYS:-3}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports: ["192.168.1.210:8790:8790"]
    volumes: ["asc_commercial:/data", "/etc/asc/tls/ca.crt:/tls/ca.crt:ro"]
    networks: [asc_net]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/api/billing/config').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }

  # GPU vision/AI worker (Intel Arc A750). Only the render node is passed through.
  worker-vision:
    profiles: ["gpu"]
    image: ai-stream-clipper-vision:${ASC_IMAGE_TAG:-0.7.0}
    container_name: asc-worker-vision
    <<: *hardening
    command: ["worker", "--roles", "vision"]
    environment:
      <<: *app-env
      ASC_WORKER_ID: "210-vision-gpu"
      ASC_GPU_DEVICE: /dev/dri/renderD128
      ASC_VISION_PROVIDER: ${ASC_VISION_PROVIDER:-openvino_vlm}
      ASC_MODELS_DIR: /models
      ASC_AI_MODELS: ${ASC_AI_MODELS:-qwen3-vl-2b-int4,qwen3-1.7b-int4}
      ASC_OPENVINO_DEVICE: GPU
      ASC_AI_ALLOW_CPU_FALLBACK: ${ASC_AI_ALLOW_CPU_FALLBACK:-true}
      ASC_CONCURRENCY_VISION: "1"
    devices: ["/dev/dri/renderD128:/dev/dri/renderD128"]
    group_add: ["${ASC_RENDER_GID:?set ASC_RENDER_GID}"]
    volumes: ["asc_workdir:/data/work", "/opt/asc/models:/models:ro", "/etc/asc/tls/ca.crt:/tls/ca.crt:ro"]
    networks: [asc_net]
    depends_on: { api: { condition: service_healthy } }
    healthcheck: *worker-health
    deploy:
      resources:
        limits: { cpus: "4", memory: 12g }

networks:
  asc_net:
    name: asc_net_210

volumes:
  asc_pgdata:
  asc_clips:
  asc_workdir:
  asc_commercial:

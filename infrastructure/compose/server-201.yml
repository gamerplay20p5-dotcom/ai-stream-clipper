# Server 201 (1htsserver) - secondary GPU AI worker (Intel Arc A750).
# This host runs six game-server containers (Pterodactyl): the worker is capped hard
# (4 CPUs / 8 GiB) with a low CPU weight so game servers always win contention.
# Operated through `sudo asc-ctl compose ...`. Images are built on 206 and loaded here.

name: asc

services:
  worker-vision:
    image: ai-stream-clipper-vision:${ASC_IMAGE_TAG:-0.5.1}
    container_name: asc-worker-vision
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=512m"]
    command: ["worker", "--roles", "vision"]
    environment:
      ASC_ENV: production
      ASC_LOG_JSON: "true"
      ASC_API_URL: https://192.168.1.210:8780
      ASC_API_CA_FILE: /tls/ca.crt
      ASC_INTERNAL_SECRET: ${ASC_INTERNAL_SECRET:?set ASC_INTERNAL_SECRET}
      ASC_WORKER_HOST_LABEL: "201"
      ASC_WORKER_ID: "201-vision-gpu"
      ASC_GPU_DEVICE: /dev/dri/renderD128
      ASC_VISION_PROVIDER: ${ASC_VISION_PROVIDER:-openvino_vlm}
      ASC_MODELS_DIR: /models
      ASC_AI_MODELS: ${ASC_AI_MODELS:-qwen3-vl-2b-int4,qwen3-1.7b-int4}
      ASC_OPENVINO_DEVICE: GPU
      ASC_AI_ALLOW_CPU_FALLBACK: ${ASC_AI_ALLOW_CPU_FALLBACK:-true}
      ASC_CONCURRENCY_VISION: "1"
    devices: ["/dev/dri/renderD128:/dev/dri/renderD128"]
    group_add: ["${ASC_RENDER_GID:?set ASC_RENDER_GID}"]
    volumes: ["asc_workdir:/data/work", "/opt/asc/models:/models:ro", "/etc/asc/tls/ca.crt:/tls/ca.crt:ro"]
    networks: [asc_net]
    cpu_shares: 256
    healthcheck:
      test: ["CMD", "clipper", "healthcheck", "worker"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits: { cpus: "4", memory: 8g }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

networks:
  asc_net:
    name: asc_net_201

volumes:
  asc_workdir:

name: backend

# API, workers, migrations and the subscription/entitlement integration.
# Fast suite on every relevant PR/push; the end-to-end media pipeline (ffmpeg + whisper) only on main or on demand.
on:
  pull_request:
    paths: ["backend/**", "tests/**", "commercial/catalog.json", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "tests/**", "commercial/catalog.json", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

# pytest reads its settings (asyncio_mode, markers, testpaths) from backend/pyproject.toml,
# so every command runs from backend/ exactly as the suite is run locally.
defaults:
  run:
    working-directory: backend

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # same minor version as the production image (infrastructure/docker/app.Dockerfile)
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: System packages (ffmpeg and caption fonts, as in the image)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-noto-core
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev,audio,vision]"
      - name: Fast suite (includes billing, entitlements and quota tests)
        run: python -m pytest -q -m "not e2e and not models" -p no:cacheprovider
      - name: Billing and entitlement tests (explicit)
        run: python -m pytest -q ../tests/test_billing_entitlements.py ../tests/test_shared_lives.py ../tests/test_delivery_rights.py ../tests/test_customer_publishing.py ../tests/test_customer_publishing_fixes.py ../tests/test_facebook_reels.py ../tests/test_outbox_link.py ../tests/test_accounts.py ../tests/test_multiuser.py ../tests/test_public_origin.py -p no:cacheprovider
      - name: Migration chain upgrades and downgrades
        run: python -m pytest -q ../tests/test_migration_0009.py ../tests/test_streamer_grants.py -p no:cacheprovider

  postgres:
    # Real PostgreSQL (same version as production) for row locks, partial unique indexes and concurrent
    # connections of the shared-lives pipeline. Disposable service container: never a real server.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.4-bookworm
        env:
          POSTGRES_USER: asc_test
          POSTGRES_PASSWORD: asc_test
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U asc_test" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      ASC_TEST_PG_URL: postgresql+psycopg://asc_test:asc_test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Migrations and shared lives on PostgreSQL
        run: python -m pytest -q -m postgres ../tests/test_postgres_shared_lives.py ../tests/test_postgres_customer_publishing.py -p no:cacheprovider

  e2e:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-noto-core
      - run: python -m pip install --upgrade pip && pip install -e ".[dev,audio,vision]"
      - name: End-to-end media pipeline
        run: python -m pytest -q -m e2e -p no:cacheprovider

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependency vulnerabilities (pip-audit)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install ".[audio,vision]"
          pip-audit --skip-editable
